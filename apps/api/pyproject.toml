[project]
name = "api"
version = "0.1.0"
description = "Python API service"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "markdown>=3.10.3",
]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8.4", "pytest-django>=4.11"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["tests"]
