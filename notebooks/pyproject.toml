[project]
name = "notebooks"
version = "0.1.0"
description = "Jupyter notebooks for LangChain/LangGraph exploration"
requires-python = ">=3.12"
dependencies = [
    # Notebook environment
    "jupytext>=1.19.5",
    "notebook>=7.6.2",
    "pygments>=2.20.0",
    # LangChain / LangGraph
    "langchain-community>=0.4.2",
    "langchain-core>=1.2.28",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.1.14",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.2",
    "langsmith>=0.7.31",
    "trustcall>=0.0.39",
    # Support
    "aiohttp>=3.13.4",
    "cryptography>=50.0.1",
    "python-dotenv>=1.2.2",
    "wikipedia>=1.4.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
